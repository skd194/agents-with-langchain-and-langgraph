[project]
name = "langc-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "truststore>=0.10.4",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langgraph",
    "langchain-openai",
    "langchain-anthropic",
    "python-dotenv",
    "beautifulsoup4",
    "pypdf>=6.14.2",
    "langchain-chroma>=1.1.0",
]

[tool.uv]
# Use the OS/native certificate store so `uv sync` works behind
# TLS-inspecting corporate proxies without passing --system-certs.
system-certs = true
